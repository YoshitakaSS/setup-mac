---
- name: set up my mac
  hosts: localhost
  connection: local

  # パッケージは MacPorts (macports/bootstrap.sh) で導入済みの前提。ここでは設定ファイルのみ扱う
  vars:
    repo_dotfiles: "{{ playbook_dir }}/dotfiles"
    links:
      - { src: "{{ playbook_dir }}/dotfiles", dest: "~/dotfiles" }
      - { src: "~/dotfiles/bash/.bash_profile", dest: "~/.bash_profile" }
      - { src: "~/dotfiles/bash/.bashrc", dest: "~/.bashrc" }
      - { src: "~/dotfiles/iterm/.iterm_profile", dest: "~/.iterm_profile" }
      - { src: "~/dotfiles/zsh/.zshrc", dest: "~/.zshrc" }
      - { src: "~/dotfiles/zsh/.zprofile", dest: "~/.zprofile" }

  tasks:
    - name: Make config
      file:
        path: ~/.config
        state: directory
        mode: 0700

    - name: Touch starship config
      file:
        path: ~/.config/starship.toml
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Check existing link destinations
      stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ links }}"
      register: dest_stat

    - name: Back up existing regular files before linking
      command: mv "{{ item.stat.path }}" "{{ item.stat.path }}.bak"
      args:
        creates: "{{ item.stat.path }}.bak"
      loop: "{{ dest_stat.results }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Create symbolic links
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop: "{{ links }}"
