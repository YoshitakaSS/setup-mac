---
- name: set up my mac
  hosts: localhost
  connection: local

  # パッケージは MacPorts (macports/bootstrap.sh) で導入済みの前提。ここでは設定ファイルのみ扱う
  vars:
    links:
      - { src: "{{ playbook_dir }}/dotfiles", dest: "~/dotfiles" }
      - { src: "~/dotfiles/bash/.bash_profile", dest: "~/.bash_profile" }
      - { src: "~/dotfiles/bash/.bashrc", dest: "~/.bashrc" }
      - { src: "~/dotfiles/iterm/.iterm_profile", dest: "~/.iterm_profile" }
      - { src: "~/dotfiles/zsh/.zshrc", dest: "~/.zshrc" }
      - { src: "~/dotfiles/zsh/.zprofile", dest: "~/.zprofile" }
      - { src: "~/dotfiles/config/mise/config.toml", dest: "~/.config/mise/config.toml" }

  tasks:
    - name: Make config
      file:
        path: ~/.config
        state: directory
        mode: 0700

    - name: Make mise config dir
      file:
        path: ~/.config/mise
        state: directory
        mode: 0700

    - name: Touch starship config
      file:
        path: ~/.config/starship.toml
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Check existing link destinations
      stat:
        path: "{{ item.dest }}"
        follow: false
      loop: "{{ links }}"
      register: dest_stat

    - name: Back up existing regular files before linking
      command: mv "{{ item.stat.path }}" "{{ item.stat.path }}.bak.{{ ansible_date_time.epoch }}"
      loop: "{{ dest_stat.results }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Create symbolic links
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop: "{{ links }}"

    # ~/.config/mise/config.toml に書いたツール (node など) を入れる
    - name: Check mise
      command: /opt/local/bin/mise --version
      register: mise_check
      changed_when: false
      failed_when: false

    - name: Install mise tools
      command: /opt/local/bin/mise install --yes
      register: mise_install
      changed_when: "'installed' in mise_install.stderr"
      when: mise_check.rc == 0
