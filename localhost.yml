---
- name: set up my mac
  hosts: localhost
  connection: local

  # パッケージは導入済みの前提 (Apple Silicon: brew/bootstrap.sh / Intel: macports/bootstrap.sh)
  # 設定ファイルの中身は dotfiles リポジトリにある。ここでは dotfiles を取得して install.sh でリンクし、mise のツールを入れる
  environment:
    PATH: "/opt/homebrew/bin:/opt/local/bin:{{ ansible_env.PATH }}"
  vars:
    dotfiles_repo: "https://github.com/YoshitakaSS/dotfiles.git"
    dotfiles_dir: "{{ ansible_env.HOME }}/Repository/dotfiles"
    # 以前このリポジトリの dotfiles/ を指していたリンク。dotfiles/ を消したので、残っていれば外す
    stale_links:
      - "{{ ansible_env.HOME }}/dotfiles"
      - "{{ ansible_env.HOME }}/.iterm_profile"

  tasks:
    - name: Clone dotfiles
      git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles_dir }}"
        update: false

    - name: Check old links into setup-mac
      stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ stale_links }}"
      register: stale_stat

    - name: Remove old links into setup-mac
      file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ stale_stat.results }}"
      when: item.stat.exists and item.stat.islnk

    # 既存の実ファイル・別のリンクは ~/.local/state/dotfiles/backups/ に退避してからリンクする
    - name: Link dotfiles
      command: "{{ dotfiles_dir }}/scripts/install.sh"
      register: dotfiles_install
      changed_when: "dotfiles_install.stdout is search('  (link|backup): ')"

    # ~/.config/mise/config.toml に書いたツール (node など) を入れる
    - name: Check mise
      command: mise --version
      register: mise_check
      changed_when: false
      failed_when: false

    - name: Install mise tools
      command: mise install --yes
      register: mise_install
      changed_when: mise_install.stderr is search('installed [1-9]')
      when: mise_check.rc == 0
